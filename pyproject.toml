[project]
name = "sql-optimizer-app"
version = "0.2.0"
description = "Streamlit app to optimize, transpile and lint SQL with sqlglot and sqlfmt"
authors = [{ name = "Jonathan Talmi", email = "jtalmi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "sqlglot>=30,<31",
    "streamlit>=1.60,<2",
    "shandy-sqlfmt>=0.32,<0.33",
    "streamlit-ace>=0.1.1,<0.2",
]

[project.scripts]
sql-optimizer = "sql_optimizer_app.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv]
# Supply-chain cooldown: ignore releases younger than a week.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_optimizer_app"]
